<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NX Historia — Alternatif tarih kum havuzu</title>
<meta name="description" content="Bir ülke ve bir tarih seç, emirlerini kendi cümlelerinle yaz, dünyanın nasıl değiştiğini gör.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect width='60' height='60' fill='%2316232e'/%3E%3Ctext x='30' y='42' font-family='Georgia,serif' font-size='38' fill='%232f6b5c' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body>

<div id="setup" class="setup">
  <div class="setup-inner">
    <div class="lang-switch" id="langSwitch"></div>
    <header class="setup-head">
      <p class="eyebrow" data-i18n="eyebrow">NX TEAM · NOVATEX</p>
      <h1 class="wordmark">NX <em>Historia</em></h1>
      <p class="lede" data-i18n="lede"></p>
    </header>

    <section class="setup-block">
      <h2 class="block-title"><span class="block-index">01</span> <span data-i18n="blockScenario"></span></h2>
      <div id="scenarioList" class="scenario-list"></div>
    </section>

    <section class="setup-block">
      <h2 class="block-title"><span class="block-index">02</span> <span data-i18n="blockNation"></span></h2>
      <div id="nationList" class="nation-list"></div>
    </section>

    <section class="setup-block">
      <h2 class="block-title"><span class="block-index">03</span> <span data-i18n="blockEngine"></span></h2>
      <div class="field-row">
        <label class="field">
          <span class="field-label" data-i18n="fieldProvider"></span>
          <select id="providerSelect"></select>
        </label>
        <label class="field">
          <span class="field-label" data-i18n="fieldModel"></span>
          <input id="modelInput" type="text" spellcheck="false" autocomplete="off">
        </label>
      </div>
      <label class="field">
        <span class="field-label" data-i18n="fieldApiKey"></span>
        <input id="apiKeyInput" type="password" spellcheck="false" autocomplete="off" data-i18n-placeholder="apiKeyPlaceholder">
      </label>
      <label class="field" id="baseUrlField" hidden>
        <span class="field-label" data-i18n="fieldBaseUrl"></span>
        <input id="baseUrlInput" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="baseUrlPlaceholder">
      </label>
      <p id="providerHint" class="hint"></p>
      <button type="button" id="testButton" class="ghost wide" data-i18n="testButton"></button>
      <p id="testResult" class="test-result" hidden></p>
      <div id="modelPanel" class="model-panel" hidden>
        <div class="model-panel-head">
          <h3 data-i18n="modelsTitle"></h3>
          <input type="search" id="modelSearch" data-i18n-placeholder="modelSearch" spellcheck="false">
        </div>
        <div class="model-filters" id="modelFilters">
          <button type="button" data-filter="all" class="is-active" data-i18n="filterAll"></button>
          <button type="button" data-filter="free" data-i18n="filterFree"></button>
          <button type="button" data-filter="paid" data-i18n="filterPaid"></button>
        </div>
        <div id="modelList" class="model-list"></div>
      </div>
    </section>

    <button id="startButton" class="primary" data-i18n="startButton" disabled></button>
    <button id="forceStartButton" class="ghost wide" data-i18n="startAnyway" hidden></button>
    <p id="setupError" class="error" hidden></p>
  </div>
</div>

<main id="game" class="game" hidden>
  <header class="topbar">
    <button class="wordmark-small" id="homeButton" type="button">NX <em>Historia</em></button>
    <div class="topbar-identity" id="topIdentity"></div>
    <div class="clock">
      <span class="clock-year" id="yearLabel">1939</span>
      <span class="clock-turn" id="turnLabel">Tur 0</span>
    </div>
    <div class="topbar-actions">
      <button id="dossierTab" class="tab" type="button" data-i18n="tabDossier"></button>
      <button id="mapTab" class="tab is-active" type="button" data-i18n="tabMap"></button>
      <button id="feedTab" class="tab" type="button" data-i18n="tabFeed"></button>
      <button id="languageButton" class="icon-button lang-button" type="button" data-i18n-label="languageLabel">EN</button>
      <button id="settingsButton" class="icon-button" type="button" data-i18n-label="settingsLabel">⚙</button>
    </div>
  </header>

  <div class="stage">
    <aside class="rail rail-left" id="dossierPanel">
      <div class="dossier-head">
        <div id="playerFlag"></div>
        <div>
          <h2 id="playerName">—</h2>
          <p id="playerLeader" class="sub">—</p>
        </div>
      </div>
      <div class="gauges" id="gauges"></div>
      <h3 class="rail-title" data-i18n="relationsTitle"></h3>
      <ul class="relations" id="relations"></ul>
      <h3 class="rail-title" data-i18n="territoriesTitle"></h3>
      <p class="territory-count" id="territoryCount">—</p>
    </aside>

    <section class="map-wrap" id="mapPanel">
      <div id="mapHost" class="map-host"></div>
      <div class="map-legend" id="mapLegend"></div>
      <div class="map-controls">
        <button type="button" data-zoom="in" data-i18n-label="zoomIn">+</button>
        <button type="button" data-zoom="out" data-i18n-label="zoomOut">−</button>
        <button type="button" data-zoom="reset" data-i18n-label="zoomReset">⤢</button>
      </div>
      <div class="map-tooltip" id="mapTooltip" hidden></div>
    </section>

    <aside class="rail rail-right" id="feedPanel">
      <h3 class="rail-title" data-i18n="feedTitle"></h3>
      <div class="feed" id="feed"></div>
    </aside>
  </div>

  <form class="console" id="commandForm">
    <div class="console-mark" data-i18n="consoleMark"></div>
    <textarea id="commandInput" rows="1" data-i18n-placeholder="commandPlaceholder" spellcheck="false"></textarea>
    <div class="console-actions">
      <button type="button" id="waitButton" class="ghost" data-i18n="waitButton"></button>
      <button type="submit" id="sendButton" class="primary compact" data-i18n="sendButton"></button>
    </div>
  </form>

  <div class="thinking" id="thinking" hidden>
    <div class="thinking-bar"></div>
    <span id="thinkingLabel"></span>
  </div>
</main>

<dialog id="settingsDialog" class="dialog">
  <h2 data-i18n="settingsTitle"></h2>
  <label class="field">
    <span class="field-label" data-i18n="fieldProvider"></span>
    <select id="settingsProvider"></select>
  </label>
  <label class="field">
    <span class="field-label" data-i18n="fieldModel"></span>
    <input id="settingsModel" type="text" spellcheck="false">
  </label>
  <label class="field">
    <span class="field-label" data-i18n="fieldApiKey"></span>
    <input id="settingsKey" type="password" spellcheck="false">
  </label>
  <label class="field" id="settingsBaseField" hidden>
    <span class="field-label" data-i18n="fieldBaseUrl"></span>
    <input id="settingsBaseUrl" type="text" spellcheck="false">
  </label>
  <div class="dialog-actions">
    <button type="button" id="resetGame" class="ghost danger" data-i18n="endGame"></button>
    <button type="button" id="settingsSave" class="primary compact" data-i18n="saveButton"></button>
  </div>
</dialog>

<script type="module" src="assets/js/app.js?v=7"></script>
</body>
</html>
